<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Portfolio | The 5 Designs</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Outfit:wght@100;200;300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.9/dist/lenis.min.js"></script>
    <style>
        :root {
            --color-bg: #F5F5F0;
            --color-obsidian: #1A1A1A;
            --color-accent: #C5A059;
            --color-text: #1A1A1A;
            --color-text-muted: rgba(26, 26, 26, 0.6);
            --font-display: 'Cormorant Garamond', serif;
            --font-body: 'Outfit', sans-serif;
            --ease-premium: cubic-bezier(0.23, 1, 0.32, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overflow-y: scroll;
            height: auto;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: var(--font-body);
            overflow-x: hidden;
            -webkit-print-color-adjust: exact;
        }

        h1, h2, h3, h4 {
            font-family: var(--font-display);
            font-weight: 300;
            letter-spacing: -0.01em;
            line-height: 1.1;
        }

        /* --- NAVIGATION --- */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 2.5rem 5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            mix-blend-mode: difference;
            color: #F5F5F0;
            transition: padding 0.5s var(--ease-premium), background-color 0.5s var(--ease-premium), mix-blend-mode 0.5s var(--ease-premium);
        }
        nav.scrolled {
            padding: 1.5rem 5rem;
            background-color: rgba(245, 245, 240, 0.95);
            backdrop-filter: blur(10px);
            mix-blend-mode: normal;
            color: var(--color-obsidian);
            border-bottom: 1px solid rgba(26, 26, 26, 0.1);
        }
        
        .nav-logo {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-style: italic;
            text-decoration: none;
            color: inherit;
        }

        .nav-center {
            display: flex;
            gap: 3rem;
            align-items: center;
        }

        .nav-link {
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: currentColor;
            transform: translateX(-101%);
            transition: transform 0.4s var(--ease-premium);
        }
        .nav-link:hover::after {
            transform: translateX(0);
        }

        /* --- HERO --- */
        .project-hero {
            width: 100%;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }
        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: linear-gradient(to top, rgba(15,15,15,1) 0%, rgba(15,15,15,0.4) 50%, rgba(15,15,15,0.8) 100%);
        }
        .hero-content {
            position: relative;
            z-index: 10;
            color: #F5F5F0;
            max-width: 800px;
            padding: 0 2rem;
        }
        .hero-title {
            font-size: 8rem;
            font-style: italic;
            text-transform: uppercase;
            margin-bottom: 2rem;
            opacity: 0;
            animation: singleReveal 2s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }
        .hero-meta {
            letter-spacing: 0.4em;
            text-transform: uppercase;
            font-size: 1rem;
            color: var(--color-accent);
            opacity: 0;
            animation: singleReveal 2s 0.3s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            margin-bottom: 1rem;
        }
        .hero-desc {
            font-size: 1.2rem;
            line-height: 1.8;
            opacity: 0;
            animation: singleReveal 2s 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            color: rgba(245, 245, 240, 0.8);
        }

        /* --- SPACES --- */
        .space-section {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 10% 10%;
            background-color: var(--color-bg);
            color: var(--color-text);
        }
        .space-section.dark {
            background-color: var(--color-obsidian);
            color: #F5F5F0;
        }
        .space-layout {
            display: flex;
            gap: 8rem;
            align-items: center;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }
        .space-layout.reverse {
            flex-direction: row-reverse;
        }
        .space-image-container {
            flex: 1.5;
            position: relative;
            overflow: hidden;
            aspect-ratio: 4/3;
        }
        .space-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transform: scale(1.1);
        }
        .space-text {
            flex: 1;
            opacity: 0;
            transform: translateY(30px);
        }
        .space-title {
            font-size: 4rem;
            font-style: italic;
            margin-bottom: 2rem;
            color: inherit;
        }
        .space-desc {
            font-size: 1.2rem;
            line-height: 1.8;
            color: inherit;
            opacity: 0.8;
        }
        .space-meta {
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--color-accent);
            margin-bottom: 1rem;
        }

        /* --- CURSOR & NOISE --- */
        .cursor-dot, .cursor-halo {
            pointer-events: none;
            position: fixed;
            top: 0;
            left: 0;
            border-radius: 50%;
            z-index: 9999;
            mix-blend-mode: difference;
        }
        .cursor-dot { width: 6px; height: 6px; background-color: #F5F5F0; }
        .cursor-halo {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(245, 245, 240, 0.5);
            transition: width 0.3s, height 0.3s, background-color 0.3s;
        }
        body.cursor-active .cursor-halo {
            width: 60px;
            height: 60px;
            background-color: rgba(245, 245, 240, 0.1);
        }
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
            opacity: 0.04;
            background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        }

        @keyframes singleReveal {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (pointer: coarse) {
            .cursor-dot, .cursor-halo, .cursor-particle {
                display: none !important;
            }
        }
        @media (max-width: 768px) {
            nav { padding: 1rem 1.5rem; flex-wrap: wrap; justify-content: center; gap: 1rem; }
            .nav-center { position: relative !important; left: 0 !important; transform: none !important; width: 100%; justify-content: center; margin-top: 0.5rem; }
            .nav-socials { display: none; }
            .hero-title { font-size: 3.5rem !important; }
            .detail-meta-grid { grid-template-columns: 1fr; gap: 2rem; }
            .content-grid { grid-template-columns: 1fr; }
            .content-grid.reverse { grid-template-columns: 1fr; }
            .full-image-section { height: 50vh; }
            .gallery-grid { grid-template-columns: 1fr; }
            .project-hero { height: 70vh; }
            section { padding: 15% 5% !important; }
        }
    </style>
</head>
<body>

    <div class="noise-overlay"></div>
    <div class="cursor-dot"></div>
    <div class="cursor-halo"></div>

    <nav class="on-dark">
        <a href="index.html" class="nav-logo">5</a>
        <div class="nav-center">
            <a href="project.html" class="nav-link">Back to Projects</a>
        </div>
    </nav>

    <div id="portfolio-container">
        <!-- Dynamic Content Injected Here -->
    </div>

    <!-- Footer -->
    <section style="background-color: var(--color-obsidian); color: #F5F5F0; padding: 4rem 10% 2rem 10%; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; min-height: 40vh;">
        <div style="width: 100%; text-align: center; margin-top: auto;">
            <p style="color: rgba(245, 245, 240, 0.4); font-size: 0.8rem; letter-spacing: 0.1em;">© 2026 THE 5 DESIGNS. ALL RIGHTS RESERVED.</p>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Lenis Smooth Scroll
            const lenis = new Lenis({
                duration: 1.2,
                easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
                smooth: true,
            });
            function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
            requestAnimationFrame(raf);
            
            // GSAP ScrollTrigger Integration
            gsap.ticker.add((time) => { lenis.raf(time * 1000) });
            gsap.ticker.lagSmoothing(0, 0);

            // Custom Cursor
            const cursorDot = document.querySelector('.cursor-dot');
            const cursorHalo = document.querySelector('.cursor-halo');
            let mouseX = 0, mouseY = 0, haloX = 0, haloY = 0;
            
            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                if(cursorDot) cursorDot.style.transform = `translate(${mouseX - 3}px, ${mouseY - 3}px)`;
            });
            
            function animateHalo() {
                haloX += (mouseX - haloX) * 0.15;
                haloY += (mouseY - haloY) * 0.15;
                if(cursorHalo) cursorHalo.style.transform = `translate(${haloX - 20}px, ${haloY - 20}px)`;
                requestAnimationFrame(animateHalo);
            }
            animateHalo();

            // Fetch Project Data
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');

            if (!projectId) {
                document.getElementById('portfolio-container').innerHTML = `<h2 style="padding: 20%; text-align: center;">Project not found.</h2>`;
                return;
            }

            fetchProjectData(projectId);
        });

        async function fetchProjectData(id) {
            try {
                let waLink = '';
                try {
                    const sRes = await fetch('/api/settings');
                    const sData = await sRes.json();
                    if (sData.success && sData.data.whatsapp_number) {
                        waLink = 'https://wa.me/' + sData.data.whatsapp_number.replace(/[^0-9]/g, '');
                    }
                } catch(e) {}

                const response = await fetch('/api/projects');
                const resData = await response.json();
                if (response.ok && resData.success) {
                    const project = resData.data.find(p => p.id === id);
                    if (project) {
                        renderProject(project, waLink);
                    } else {
                        document.getElementById('portfolio-container').innerHTML = `<h2 style="padding: 20%; text-align: center;">Project not found.</h2>`;
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        function renderProject(p, waLink) {
            let html = `
                <section class="project-hero">
                    <img src="${p.image_url}" class="hero-bg" alt="${p.title}">
                    <div class="hero-overlay"></div>
                    
                    <div class="hero-content">
                        <p class="hero-meta">${p.meta}</p>
                        <h1 class="hero-title">${p.title}</h1>
                        ${p.area || p.location ? `<p style="font-size: 1rem; color: var(--color-accent); letter-spacing: 0.1em; margin-bottom: 2rem; text-transform: uppercase;">
                            ${p.area ? 'Area: ' + p.area : ''}
                            ${p.area && p.location ? ' &nbsp;|&nbsp; ' : ''}
                            ${p.location ? 'Location: ' + p.location : ''}
                        </p>` : ''}
                        <p class="hero-desc">${p.description}</p>
                    </div>
                </section>
            `;

            if (p.spaces && p.spaces.length > 0) {
                p.spaces.forEach((space, index) => {
                    const isEven = index % 2 === 0;
                    const darkClass = isEven ? 'dark' : '';
                    const reverseClass = isEven ? '' : 'reverse';
                    
                    html += `
                        <section class="space-section ${darkClass}">
                            <div class="space-layout ${reverseClass}">
                                <div class="space-image-container">
                                    <img src="${space.image_url}" alt="${space.name}">
                                </div>
                                <div class="space-text">
                                    <p class="space-meta">Space 0${index + 1}</p>
                                    <h2 class="space-title">${space.name}</h2>
                                    <p class="space-desc">${space.description || ''}</p>
                                </div>
                            </div>
                        </section>
                    `;
                });
            } else {
                html += `
                    <section class="space-section">
                        <div style="text-align: center; width: 100%;">
                            <p style="color: var(--color-text-muted); font-style: italic;">Detailed portfolio coming soon.</p>
                        </div>
                    </section>
                `;
            }

            if (waLink) {
                html += `
                <section style="background-color: var(--color-bg); padding: 5rem 10%; text-align: center;">
                    <p style="font-family: var(--font-display); font-size: 2rem; font-style: italic; margin-bottom: 2rem; color: var(--color-obsidian);">Interested in creating your own luxury space?</p>
                    <a href="${waLink}" target="_blank" style="display: inline-block; background: var(--color-obsidian); color: #F5F5F0; padding: 1.2rem 2.5rem; text-decoration: none; text-transform: uppercase; letter-spacing: 0.2em; font-size: 0.85rem; transition: opacity 0.3s; cursor: pointer;">Message us on WhatsApp</a>
                </section>
                `;
            }

            document.getElementById('portfolio-container').innerHTML = html;

            // Initialize scroll animations for the injected content
            initScrollAnimations();
        }

        function initScrollAnimations() {
            // Navigation State
            const nav = document.querySelector('nav');
            ScrollTrigger.create({
                trigger: ".project-hero",
                start: "top top",
                onLeave: () => { if(nav) { nav.classList.remove('on-dark'); nav.classList.add('scrolled'); } },
                onEnterBack: () => { if(nav) { nav.classList.add('on-dark'); nav.classList.remove('scrolled'); } }
            });

            // Spaces Reveal
            document.querySelectorAll('.space-section').forEach(section => {
                const img = section.querySelector('img');
                const text = section.querySelector('.space-text');
                
                if (img) {
                    gsap.to(img, {
                        scrollTrigger: {
                            trigger: section,
                            start: "top 70%",
                            toggleActions: "play none none reverse"
                        },
                        opacity: 1,
                        scale: 1,
                        duration: 1.5,
                        ease: "power3.out"
                    });
                }
                
                if (text) {
                    gsap.to(text, {
                        scrollTrigger: {
                            trigger: section,
                            start: "top 70%",
                            toggleActions: "play none none reverse"
                        },
                        y: 0,
                        opacity: 1,
                        duration: 1.2,
                        delay: 0.3,
                        ease: "power3.out"
                    });
                }
            });
        }
    </script>
</body>
</html>
